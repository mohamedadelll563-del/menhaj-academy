<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الطالب وولي الأمر | أكاديمية منهاج</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #062015;
            --bg-card: #0a3322;
            --primary-green: #10b981;
            --text-light: #ffffff;
            --text-muted: #a7f3d0;
            --border-color: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); min-height: 100vh; padding: 15px 10px; }
        .container { width: 100%; max-width: 900px; margin: 0 auto; }
        .header-bar { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; padding: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .user-info h3 { font-size: 18px; font-weight: 900; color: var(--primary-green); }
        .user-info p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
        .btn-logout { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-logout:hover { background: #ef4444; color: white; }
        .info-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
        .info-card { background: var(--bg-card); border: 1px solid var(--border-color); padding: 14px 10px; border-radius: 12px; text-align: center; }
        .info-card .title { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
        .info-card .val { font-size: 16px; font-weight: 800; color: var(--primary-green); }
        .tabs-nav { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { flex: 1; padding: 12px 10px; background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-muted); border-radius: 12px; font-size: 14px; font-weight: 800; cursor: pointer; transition: all 0.3s ease; text-align: center; }
        .tab-btn.active, .tab-btn:hover { background: var(--primary-green); color: #ffffff; border-color: var(--primary-green); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .video-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .video-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; padding: 15px; }
        .video-card video { width: 100%; max-height: 300px; background: #000; border-radius: 8px; object-fit: cover; }
        .video-body { margin-top: 12px; }
        .video-body h4 { font-size: 16px; color: white; margin-bottom: 8px; }
        .quiz-box { background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; margin-top: 12px; }
        .quiz-option { display: block; background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 6px; margin: 6px 0; cursor: pointer; font-size: 13px; transition: 0.2s; border: 1px solid transparent; }
        .quiz-option:hover { background: rgba(16,185,129,0.1); border-color: var(--primary-green); }
        .report-box { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; padding: 18px; margin-bottom: 15px; }
        @media (max-width: 650px) { .info-cards { grid-template-columns: 1fr; } .tabs-nav { flex-direction: column; } }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-bar">
            <div class="user-info">
                <h3 id="dispStudentName">🎓 الطالب: جاري التحميل...</h3>
                <p>ولي الأمر: <span id="dispParentName">---</span> | المعلم: <span id="dispTeacherName">---</span></p>
            </div>
            <button class="btn-logout" onclick="logout()">تسجيل الخروج 🚪</button>
        </div>

        <div class="info-cards">
            <div class="info-card">
                <div class="title">مدة الحصة</div>
                <div class="val" id="dispDuration">--</div>
            </div>
            <div class="info-card">
                <div class="title">عدد الحصص شهرياً</div>
                <div class="val" id="dispSessions">-- حصص</div>
            </div>
            <div class="info-card">
                <div class="title">الاشتراك الشهري</div>
                <div class="val" id="dispFee">-- ج.م</div>
            </div>
        </div>

        <div class="tabs-nav">
            <button class="tab-btn active" onclick="switchTab('videos', this)">🎬 الدروس والاختبارات</button>
            <button class="tab-btn" onclick="switchTab('reports', this)">📝 التقارير والملاحظات</button>
            <button class="tab-btn" onclick="switchTab('attendance', this)">📊 سجل الحضور والتفاعل</button>
        </div>

        <div id="tab-videos" class="tab-content active">
            <div id="videosContainer" class="video-grid"></div>
        </div>

        <div id="tab-reports" class="tab-content">
            <div id="reportsContainer">
                <div class="report-box" style="text-align: center; color: var(--text-muted);">لا توجد تقارير مسجلة حتى الآن.</div>
            </div>
        </div>

        <div id="tab-attendance" class="tab-content">
            <div id="attendanceContainer">
                <div class="report-box" style="text-align: center; color: var(--text-muted);">جاري تحميل سجل الحضور...</div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://rihnbystzsxwfrdabcxa.supabase.co";
        const SUPABASE_KEY = "sb_publishable_81So_0s9ttAS-SmJ6Ff0jQ_UaurIrNE";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentStudentObj = null;

        window.onload = async function() {
            try {
                const savedUser = localStorage.getItem('currentUser');
                if (savedUser) {
                    currentStudentObj = JSON.parse(savedUser);
                    
                    // التحقق من حالة التفعيل ومنع عرض البيانات إذا كان غير مفعل
                    const sStatus = currentStudentObj.status ? String(currentStudentObj.status).toLowerCase().trim() : 'pending';
                    if (sStatus !== 'active' && sStatus !== 'مفعل' && sStatus !== 'true') {
                        window.location.href = 'pending.html';
                        return;
                    }

                    displayStudentData(currentStudentObj);
                    return;
                }

                // إذا لم يوجد حساب مخزن يتم التحويل لصفحة تسجيل الدخول بدلاً من تحميل أحدث طالب عشوائي
                window.location.href = 'login.html';

            } catch(err) {
                window.location.href = 'login.html';
            }
        };

        function displayStudentData(student) {
            document.getElementById('dispStudentName').textContent = '🎓 الطالب: ' + (student.name || 'غير معروف');
            document.getElementById('dispParentName').textContent = student.parent_name || 'غير محدد';
            document.getElementById('dispTeacherName').textContent = student.teacher_name || 'غير محدد';

            let rawDuration = student.session_duration ?? student.duration ?? student.مدة_الجلسة ?? '';
            let durationText = 'غير محدد';

            if (rawDuration !== '' && rawDuration !== null && rawDuration !== undefined) {
                let strVal = String(rawDuration).trim();
                let numVal = parseFloat(strVal);

                if (!isNaN(numVal)) {
                    if (numVal === 0.5) {
                        durationText = '30 دقيقة';
                    } else if (numVal === 0.66 || numVal === 0.67) {
                        durationText = '40 دقيقة';
                    } else if (numVal === 0.75) {
                        durationText = '45 دقيقة';
                    } else if (numVal === 1 || numVal === 1.0) {
                        durationText = 'ساعة كاملة';
                    } else if (numVal < 1) {
                        durationText = Math.round(numVal * 60) + ' دقيقة';
                    } else {
                        durationText = numVal + ' ساعة';
                    }
                } else {
                    durationText = strVal;
                }
            }

            document.getElementById('dispDuration').textContent = durationText;
            document.getElementById('dispSessions').textContent = (student.classes_count || 12) + ' حصص';
            document.getElementById('dispFee').textContent = (student.fees || 500) + ' ج.م';

            loadStudentContent(student.name);
            loadStudentReports(student.name);
            loadStudentAttendance(student.name);
        }

        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
        }

        async function loadStudentContent(studentName) {
            const container = document.getElementById('videosContainer');
            
            const { data: videos } = await _supabase.from('videos').select('*').order('id', { ascending: false });
            const { data: quizzes } = await _supabase.from('quizzes').select('*');
            const { data: results } = await _supabase.from('quiz_results').select('*').eq('student_name', studentName);

            if (!videos || videos.length === 0) {
                container.innerHTML = '<div style="text-align:center; color: var(--text-muted); padding: 20px;">لا توجد دروس متاحة حالياً.</div>';
                return;
            }

            const studentVideos = videos.filter(v => v.target_type === 'all' || v.student_name === studentName);
            if (studentVideos.length === 0) {
                container.innerHTML = '<div style="text-align:center; color: var(--text-muted); padding: 20px;">لا توجد دروس مخصصة حالياً.</div>';
                return;
            }

            container.innerHTML = studentVideos.map(v => {
                const vQuizzes = quizzes ? quizzes.filter(q => q.id_video == v.id || q.video_id == v.id) : [];
                
                let quizzesHTML = '';
                if (vQuizzes.length > 0) {
                    quizzesHTML = `<div class="quiz-box"><h5 style="color: var(--primary-green); margin-bottom: 8px; font-size: 14px;">📝 اختبار قصير على الدرس:</h5>`;
                    vQuizzes.forEach((q, idx) => {
                        const solved = results ? results.find(r => r.quiz_id == q.id) : null;
                        if (solved) {
                            quizzesHTML += `<div style="font-size:12px; margin-top:6px; color:${solved.is_correct ? '#10b981' : '#ef4444'}">
                                السؤال (${idx+1}): ${q.question} - <strong>${solved.is_correct ? '✅ اجابة صحيحة' : '❌ اجابة خاطئة'}</strong>
                            </div>`;
                        } else {
                            quizzesHTML += `
                                <div style="margin-bottom: 10px; font-size: 13px;">
                                    <p><strong>س${idx+1}:</strong> ${q.question}</p>
                                    <div class="quiz-option" onclick="submitQuizAnswer(${q.id}, 'a', '${q.correct_answer}', '${studentName}')">أ) ${q.option_a}</div>
                                    <div class="quiz-option" onclick="submitQuizAnswer(${q.id}, 'b', '${q.correct_answer}', '${studentName}')">ب) ${q.option_b}</div>
                                    <div class="quiz-option" onclick="submitQuizAnswer(${q.id}, 'c', '${q.correct_answer}', '${studentName}')">ج) ${q.option_c}</div>
                                    <div class="quiz-option" onclick="submitQuizAnswer(${q.id}, 'd', '${q.correct_answer}', '${studentName}')">د) ${q.option_d}</div>
                                </div>
                            `;
                        }
                    });
                    quizzesHTML += `</div>`;
                }

                return `
                    <div class="video-card">
                        <video controls controlsList="nodownload">
                            <source src="${v.video_url}" type="video/mp4">
                        </video>
                        <div class="video-body">
                            <h4>${v.title}</h4>
                            ${quizzesHTML}
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function submitQuizAnswer(quizId, chosen, correct, studentName) {
            const isCorrect = (chosen === correct);
            const { error } = await _supabase.from('quiz_results').insert([{
                quiz_id: quizId,
                student_id: currentStudentObj.id,
                student_name: studentName,
                selected_answer: chosen,
                is_correct: isCorrect
            }]);

            if (error) {
                alert("حدث خطأ أثناء حفظ الإجابة.");
            } else {
                alert(isCorrect ? "إجابة صحيحة أحسنت! 🌟" : "إجابة خاطئة، حاول مرة أخرى في الدرس القادم.");
                loadStudentContent(studentName);
            }
        }

        async function loadStudentReports(studentName) {
            const container = document.getElementById('reportsContainer');
            const { data } = await _supabase.from('evaluations').select('*').eq('student_name', studentName).order('id', { ascending: false });
            if (data && data.length > 0) {
                container.innerHTML = data.map(r => `
                    <div class="report-box">
                        <h4 style="color: var(--primary-green); margin-bottom: 6px;">📅 تقييم حصة يوم: ${r.lesson_date || 'اليوم'}</h4>
                        <p style="font-size: 13px;"><strong>الحفظ الجديد:</strong> ${r.new_memorization || '-'}</p>
                        <p style="font-size: 13px;"><strong>الواجب:</strong> ${r.homework || '-'}</p>
                        <p style="font-size: 13px; margin-top: 6px; color: var(--text-muted);"><strong>ملاحظات المعلم:</strong> ${r.teacher_notes || '-'}</p>
                    </div>
                `).join('');
            }
        }

        async function loadStudentAttendance(studentName) {
            const container = document.getElementById('attendanceContainer');
            const { data } = await _supabase.from('attendance').select('*').eq('student_name', studentName).order('id', { ascending: false });
            if (data && data.length > 0) {
                container.innerHTML = data.map(att => `
                    <div class="report-box" style="padding: 10px 15px; display:flex; justify-content:space-between;">
                        <span>📌 ${att.details}</span>
                        <span style="font-size:11px; color:var(--text-muted);">${new Date(att.created_at).toLocaleString('ar-EG')}</span>
                    </div>
                `).join('');
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
