<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قيد المراجعة - أكاديمية منهاج</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #0f382b;
            --bg-card: #164e3d;
            --accent-orange: #f59e0b;
            --text-muted: #d1d5db;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--primary-green);
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: var(--bg-card);
            padding: 40px 30px;
            border-radius: 16px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }
        h2 {
            color: var(--accent-orange);
            margin-bottom: 15px;
            font-size: 24px;
            font-weight: 900;
        }
        p {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background-color: var(--accent-orange);
            color: #0f382b;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            transition: 0.3s;
        }
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>⏳ قيد المراجعة والتفعيل</h2>
        <p>يرجى الانتظار لحين مراجعة البيانات واستكمال تفاصيل الاشتراك من قبل الإدارة.</p>
        <a href="login.html" class="btn">العودة لتسجيل الدخول</a>
    </div>

</body>
</html>
