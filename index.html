<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية منهاج | التعليمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #062015;
            --bg-card: #0a3322;
            --primary-green: #10b981;
            --primary-hover: #059669;
            --text-light: #ffffff;
            --text-muted: #a7f3d0;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            text-align: center;
            padding: 25px 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            background: var(--bg-card);
            padding: 12px 20px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .logo {
            font-size: 18px;
            font-weight: 900;
            color: white;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-top {
            background: transparent;
            border: 1px solid var(--primary-green);
            color: white;
            padding: 7px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            transition: 0.3s;
        }

        .btn-top:hover {
            background: var(--primary-green);
        }

        .hero-content {
            padding: 20px 0;
        }

        .hero-badge {
            background: rgba(16, 185, 129, 0.15);
            color: var(--primary-green);
            display: inline-block;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(16, 185, 129, 0.3);
            font-weight: 700;
        }

        h1 {
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        h1 span {
            color: var(--primary-green);
            display: block;
        }

        p {
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto 30px;
            line-height: 1.7;
            font-size: 15px;
        }

        .btn-main {
            display: inline-block;
            background: var(--primary-green);
            color: white;
            text-decoration: none;
            padding: 14px 35px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 15px;
            transition: 0.3s;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
        }

        .btn-main:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        footer {
            margin-top: 30px;
            font-size: 12px;
            color: var(--text-muted);
            opacity: 0.8;
        }

        /* ميديا كويري لتناسب شاشات الموبايل الصغيرة */
        @media (max-width: 600px) {
            h1 {
                font-size: 26px;
            }
            .nav {
                margin-bottom: 25px;
                padding: 10px 15px;
            }
            p {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- شريط التنقل العلوي -->
        <div class="nav">
            <div class="logo">📖 أكاديمية منهاج</div>
            <a href="login.html" class="btn-top">تسجيل الدخول</a>
        </div>

        <!-- محتوى الواجهة الرئيسي -->
        <div class="hero-content">
            <div class="hero-badge">أفضل منصة لتعليم القرآن الكريم واللغة العربية</div>
            
            <h1>ابدأ رحلتك المباركة مع <span>أكاديمية منهاج</span></h1>
            
            <p>نتشرف بتقديم أفضل الخدمات التعليمية عبر الإنترنت بأعلى مستويات الجودة بإشراف نخبة من المعلمين والمعلمات الأكفاء.</p>

            <a href="login.html" class="btn-main">انضم إلينا الآن ←</a>
        </div>
    </div>

    <!-- تذييل الصفحة -->
    <footer>
        جميع الحقوق محفوظة © أكاديمية منهاج 2026
    </footer>

</body>
</html>
